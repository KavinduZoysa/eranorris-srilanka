    <script>
        function toggleMobileNav() {
            const nav = document.getElementById('navWrapper');
            const ham = document.getElementById('hamburger');
            const overlay = document.getElementById('mobileOverlay');
            nav.classList.toggle('open');
            ham.classList.toggle('open');
            overlay.classList.toggle('open');
            document.body.style.overflow = nav.classList.contains('open') ? 'hidden' : '';
        }
        function closeMobileNav() {
            document.getElementById('navWrapper').classList.remove('open');
            document.getElementById('hamburger').classList.remove('open');
            document.getElementById('mobileOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.addEventListener('DOMContentLoaded', () => {
            const btns = document.querySelectorAll('#galleryFilters .gf-btn');
            const imgs = document.querySelectorAll('#galleryGrid img');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const filter = btn.dataset.filter;
                    imgs.forEach(img => {
                        if (filter === 'all' || img.dataset.category === filter) {
                            img.classList.remove('gf-hidden');
                        } else {
                            img.classList.add('gf-hidden');
                        }
                    });
                });
            });
        });
    </script>
